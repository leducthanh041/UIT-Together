name: Refresh Official Conference Dates
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conference-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Static Build Dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Conservative Parser
        run: python -m unittest discover -s tests -p test_conference_updates.py -v
      - name: Refresh Official Sources
        run: python scripts/update_conferences.py
      - name: Validate Public Build
        run: |
          python scripts/build.py
          python scripts/check_site.py
      - name: Commit Only Conference Source Data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- src/data/conferences.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/conferences.json
          git commit -m 'Refresh official conference dates'
          git push origin "HEAD:$DEFAULT_BRANCH"
