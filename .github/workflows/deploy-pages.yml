name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh Official Conference Dates]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Build Dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and Test Local Routes
        run: |
          python scripts/build.py
          python scripts/check_site.py
          python -m unittest discover -s tests -v
          for test in tests/*.test.js; do node "$test"; done
      - name: Build and Check Pages Paths
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python scripts/build.py --base-path "$PAGES_BASE_PATH"
          python scripts/check_site.py --base-path "$PAGES_BASE_PATH"
      - name: Upload Only the Generated Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
